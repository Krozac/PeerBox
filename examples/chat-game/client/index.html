<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#27214d" />
    <title>PeerBox Chat Game</title>
    <link rel="stylesheet" href="./assets/styles/bubbles.css" />
    <link rel="stylesheet" href="./lobby.css" />
  </head>
  <body class="lobby-page">
    <main class="lobby-card">
      <img class="lobby-logo" src="./assets/peerbox.svg" alt="PeerBox" />
      <p class="eyebrow">PeerBox example</p>
      <h1 class="pb-bubbles-title">Bubble Chat</h1>
      <p class="lobby-description">Start a room in your browser, then invite people to join.</p>

      <form id="join-form" class="lobby-form">
        <label for="username">Your name</label>
        <input id="username" name="username" maxlength="16" autocomplete="nickname" required placeholder="e.g. Alex" />
        <label for="room-id">Room code</label>
        <input id="room-id" name="roomId" maxlength="32" autocomplete="off" required placeholder="Enter a room code" />
        <button class="pb-bubbles-button" type="submit">Join room</button>
      </form>

      <p id="lobby-status" class="lobby-status" role="status"></p>
      <a class="lobby-host-link" href="./host.html">Create a room as host</a>
    </main>
    <script type="module" src="./join.js"></script>
  </body>
</html>
